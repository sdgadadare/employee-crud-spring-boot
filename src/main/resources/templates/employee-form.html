<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Employee Form</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }
        .container {
            width: 92%;
            max-width: 600px;
            margin: 50px auto;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }
        h1 { margin-top: 0; }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        .error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 4px;
        }
        .buttons {
            margin-top: 25px;
        }
        button, a {
            padding: 10px 18px;
            border-radius: 6px;
            border: none;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }
        button {
            background: #198754;
            color: white;
        }
        a {
            background: #6c757d;
            color: white;
            margin-left: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1 th:text="${pageTitle}">Add Employee</h1>

        <form th:action="@{/employees/save}" th:object="${employee}" method="post">

            <input type="hidden" th:field="*{id}">

            <label>Name</label>
            <input type="text" th:field="*{name}" placeholder="Enter employee name">
            <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="Enter email">
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <label>Department</label>
            <input type="text" th:field="*{department}" placeholder="e.g. IT">
            <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>

            <label>Salary</label>
            <input type="number" step="0.01" th:field="*{salary}" placeholder="Enter salary">
            <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>

            <div class="buttons">
                <button type="submit">Save Employee</button>
                <a href="/employees">Back</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
